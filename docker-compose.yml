services:
  yanera-development:
    build: .
    container_name: yanera-development
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    labels:
      # dash shows its servers, members and ping, from GET /status on port 8080
      dash.app: discord-bot
    networks:
      - default
      - postgres_network

networks:
  postgres_network:
    external: true
    name: postgres_default
